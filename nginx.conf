server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # PDF.js worker is an ES module. Older mime maps serve .mjs as a download.
    location ~* \.mjs$ {
        default_type application/javascript;
    }
}
